<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考前充電站 | 緩解壓力，找回專注</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .glass-morphism {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 1rem;
        }
        .breathing-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, #667eea 0%, #764ba2 100%);
            transition: transform 4s ease-in-out;
        }
        .breathing-active {
            transform: scale(1.5);
        }
        .hidden { display: none; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- 標題區 -->
        <header class="text-center mb-10">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">🌿 考前充電站</h1>
            <p class="text-gray-600">深呼吸，這只是人生的一個過程，你比想像中更強大。</p>
        </header>

        <!-- 功能選單 -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <button onclick="showSection('timer')" class="p-4 glass-morphism hover:bg-white transition flex flex-col items-center">
                <i class="fas fa-stopwatch text-2xl text-indigo-500 mb-2"></i>
                <span>番茄鐘</span>
            </button>
            <button onclick="showSection('breathe')" class="p-4 glass-morphism hover:bg-white transition flex flex-col items-center">
                <i class="fas fa-wind text-2xl text-blue-500 mb-2"></i>
                <span>呼吸調節</span>
            </button>
            <button onclick="showSection('sounds')" class="p-4 glass-morphism hover:bg-white transition flex flex-col items-center">
                <i class="fas fa-headphones text-2xl text-green-500 mb-2"></i>
                <span>環境音</span>
            </button>
            <button onclick="showSection('ai-chat')" class="p-4 glass-morphism hover:bg-white transition flex flex-col items-center">
                <i class="fas fa-robot text-2xl text-purple-500 mb-2"></i>
                <span>AI 聊聊</span>
            </button>
        </div>

        <!-- 主要內容區 -->
        <main class="glass-morphism p-6 md:p-10 shadow-xl">
            
            <!-- 番茄鐘計時器 -->
            <section id="timer" class="text-center">
                <h2 class="text-2xl font-bold mb-6">專注計時器</h2>
                <div class="text-6xl font-mono font-bold text-indigo-600 mb-8" id="timer-display">25:00</div>
                <div class="space-x-4">
                    <button id="start-btn" onclick="toggleTimer()" class="bg-indigo-600 text-white px-8 py-2 rounded-full hover:bg-indigo-700 transition">開始</button>
                    <button onclick="resetTimer()" class="border border-gray-300 px-8 py-2 rounded-full hover:bg-gray-100 transition">重設</button>
                </div>
                <p class="mt-6 text-sm text-gray-500">建議：讀書 25 分鐘，休息 5 分鐘。</p>
            </section>

            <!-- 呼吸調節 -->
            <section id="breathe" class="hidden text-center">
                <h2 class="text-2xl font-bold mb-4">4-7-8 呼吸法</h2>
                <p class="mb-8 text-gray-600" id="breathe-instruction">點擊下方圓圈開始練習</p>
                <div class="flex justify-center items-center h-64">
                    <div id="breathe-circle" onclick="startBreathing()" class="breathing-circle shadow-2xl flex items-center justify-center cursor-pointer">
                        <span class="text-white font-bold" id="breathe-text">點擊開始</span>
                    </div>
                </div>
            </section>

            <!-- 環境音 -->
            <section id="sounds" class="hidden">
                <h2 class="text-2xl font-bold mb-6 text-center">專注環境音</h2>
                <div class="space-y-6">
                    <div class="flex items-center justify-between p-4 bg-white/50 rounded-lg">
                        <div class="flex items-center">
                            <i class="fas fa-cloud-showers-heavy w-8 text-blue-400"></i>
                            <span>午後雷雨</span>
                        </div>
                        <input type="range" class="w-1/2" onchange="updateVolume('rain', this.value)">
                    </div>
                    <div class="flex items-center justify-between p-4 bg-white/50 rounded-lg">
                        <div class="flex items-center">
                            <i class="fas fa-fire w-8 text-orange-400"></i>
                            <span>營火嗶啵聲</span>
                        </div>
                        <input type="range" class="w-1/2" onchange="updateVolume('fire', this.value)">
                    </div>
                    <div class="flex items-center justify-between p-4 bg-white/50 rounded-lg">
                        <div class="flex items-center">
                            <i class="fas fa-leaf w-8 text-green-400"></i>
                            <span>森林微風</span>
                        </div>
                        <input type="range" class="w-1/2" onchange="updateVolume('forest', this.value)">
                    </div>
                </div>
                <p class="mt-6 text-center text-xs text-gray-400">* 實際音效需連結音源檔，此處為介面演示。</p>
            </section>

            <!-- AI 諮詢區 -->
            <section id="ai-chat" class="hidden">
                <h2 class="text-2xl font-bold mb-4 text-center">AI 壓力諮詢員</h2>
                <div id="chat-box" class="h-64 overflow-y-auto mb-4 p-4 border rounded-lg bg-gray-50 space-y-3 text-sm">
                    <div class="text-indigo-600 font-bold">AI: 你好！考試辛苦了。現在心裡感覺如何？有什麼想聊聊的嗎？</div>
                </div>
                <div class="flex gap-2">
                    <input type="text" id="user-input" placeholder="說說你的壓力..." class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-400">
                    <button onclick="sendMessage()" class="bg-purple-600 text-white px-6 py-2 rounded-lg hover:bg-purple-700">傳送</button>
                </div>
            </section>

        </main>

        <!-- 每日語錄 -->
        <footer class="mt-8 text-center text-gray-600 italic">
            <p id="quote">「不論結果如何，現在努力的你已經非常出色了。」</p>
        </footer>
    </div>

    <script>
        // 切換區塊
        function showSection(id) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        // 番茄鐘邏輯
        let timerSeconds = 1500;
        let timerInterval;
        let isRunning = false;

        function updateTimerDisplay() {
            const mins = Math.floor(timerSeconds / 60);
            const secs = timerSeconds % 60;
            document.getElementById('timer-display').innerText = 
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerInterval);
                document.getElementById('start-btn').innerText = '開始';
            } else {
                timerInterval = setInterval(() => {
                    if (timerSeconds > 0) {
                        timerSeconds--;
                        updateTimerDisplay();
                    } else {
                        clearInterval(timerInterval);
                        alert('時間到！休息一下吧。');
                    }
                }, 1000);
                document.getElementById('start-btn').innerText = '暫停';
            }
            isRunning = !isRunning;
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerSeconds = 1500;
            isRunning = false;
            updateTimerDisplay();
            document.getElementById('start-btn').innerText = '開始';
        }

        // 呼吸法邏輯
        function startBreathing() {
            const circle = document.getElementById('breathe-circle');
            const text = document.getElementById('breathe-text');
            const instruction = document.getElementById('breathe-instruction');
            
            let count = 0;
            const phases = [
                { text: '吸氣...', time: 4000, class: 'breathing-active' },
                { text: '憋氣...', time: 7000, class: 'breathing-active' },
                { text: '呼氣...', time: 8000, class: '' }
            ];

            function runPhase() {
                const phase = phases[count % 3];
                text.innerText = phase.text;
                instruction.innerText = `跟著節奏：${phase.text}`;
                if (phase.class) circle.classList.add(phase.class);
                else circle.classList.remove('breathing-active');
                
                setTimeout(() => {
                    count++;
                    runPhase();
                }, phase.time);
            }
            runPhase();
        }

        // AI 聊天邏輯 (使用 Gemini API)
        const apiKey = ""; // 由環境自動注入

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const message = input.value.trim();
            if (!message) return;

            // 顯示使用者訊息
            chatBox.innerHTML += `<div class="text-right text-gray-700"><b>你:</b> ${message}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: message }] }],
                        systemInstruction: { parts: [{ text: "你是一位溫柔、專業的心理輔導員。針對正面對考試壓力的學生提供溫暖、鼓勵且具體的減壓建議。回答語氣要親切，盡量簡短有力。" }] }
                    })
                });

                const data = await response.json();
                const aiResponse = data.candidates[0].content.parts[0].text;
                
                chatBox.innerHTML += `<div class="text-indigo-600"><b>AI:</b> ${aiResponse}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                chatBox.innerHTML += `<div class="text-red-500 text-xs">抱歉，AI 暫時休息中，請稍後再試。</div>`;
            }
        }

        // 環境音模擬控制 (僅演示介面邏輯)
        function updateVolume(type, val) {
            console.log(`調整 ${type} 音量為: ${val}%`);
        }

        // 隨機語錄
        const quotes = [
            "「不論結果如何，現在努力的你已經非常出色了。」",
            "「壓力是成長的燃料，適度休息能跑得更遠。」",
            "「你不需要完美，你只需要在今天盡力而為。」",
            "「每一滴汗水，都是通往成功的階梯。」",
            "「記得喝口水，站起來伸個懶腰吧！」"
        ];
        document.getElementById('quote').innerText = quotes[Math.floor(Math.random() * quotes.length)];

    </script>
</body>
</html>
