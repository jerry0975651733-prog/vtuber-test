<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 虛擬助教</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a202c; touch-action: none; }
        
        #canvas-container { 
            width: 100vw; 
            height: 100vh; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 0; 
            background-image: url('https://images.unsplash.com/photo-1554118811-1e0d58224f24?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }

        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
                "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.2.0/lib/three-vrm.module.js"
            }
        }
    </script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer" class="flex flex-col justify-end p-4 relative">
        <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 w-[calc(100%-2rem)] sm:w-full max-w-lg pointer-events-auto flex flex-col gap-3 bg-white/10 backdrop-blur-sm p-4 rounded-2xl shadow-sm border border-white/30 z-10 transition-all duration-300">
            <div id="chat-bubble" class="hidden px-2 max-h-40 overflow-y-auto no-scrollbar">
                <p id="chat-text" class="text-lg text-blue-900 font-medium leading-relaxed drop-shadow-sm"></p>
            </div>

            <div class="flex gap-2 w-full">
                <button id="mic-btn" class="bg-white/20 hover:bg-white/30 backdrop-blur text-blue-900 px-3 py-3 rounded-xl shadow-inner border border-blue-900/10 transition-colors shrink-0 flex items-center justify-center" title="語音輸入">
                    <svg id="mic-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                    </svg>
                </button>
                <input type="text" id="chat-input" placeholder="與角色對話..." class="flex-1 bg-white/20 text-blue-900 placeholder-blue-800/50 px-4 py-3 rounded-xl border border-blue-900/10 focus:outline-none focus:border-blue-900/30 focus:bg-white/40 shadow-inner text-base transition-colors font-medium" />
                <button id="send-btn" class="bg-blue-800/70 hover:bg-blue-700/80 active:scale-95 active:bg-blue-900 backdrop-blur text-white px-5 py-3 rounded-xl shadow transition-all duration-150 font-bold text-base shrink-0">發送</button>
            </div>
        </div>

        <div id="loading-overlay" class="absolute top-0 left-0 w-full h-full flex items-center justify-center bg-black/20 backdrop-blur-sm z-50 pointer-events-none transition-opacity duration-500 hidden">
            <div class="text-white flex flex-col items-center">
                <svg class="animate-spin h-10 w-10 text-white mb-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>更換角色中...</span>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

        let scene, camera, renderer, controls;
        let currentVrm = undefined;
        let particles;
        const clock = new THREE.Clock();

        // --- 設定更換模型的地方 ---
        // 如果你有新的模型檔案（例如 person2.vrm），只需修改下面這個路徑
        const modelUrl = './AvatarSample_W.vrm'; 

        let knowledgeBaseText = "";
        let systemPromptText = "你是一個擁有 3D 虛擬身體的 AI 虛擬助教。你的名字叫做『晏韜』。回答要簡短生動。";
        let openingPhrase = "您好！我是晏韜，有什麼我可以幫忙的嗎？";

        let isSpeaking = false;
        let lipSyncTimer = 0;
        let conversationHistory = [];

        async function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.45, -1.6); 

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.screenSpacePanning = true;
            controls.target.set(0, 1.3, 0); 
            controls.update();

            setupLights();
            setupParticles();
            
            window.addEventListener('resize', onWindowResize);
            
            // 載入模型
            loadVRM(modelUrl);
            animate();
        }

        function setupLights() {
            const ambientLight = new THREE.HemisphereLight(0xffffff, 0x999999, 0.8);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xfff0dd, 2.0);
            directionalLight.position.set(2, 5, 3);
            scene.add(directionalLight);
        }

        function setupParticles() {
            const particleCount = 200;
            const particleGeometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            for(let i = 0; i < particleCount; i++) {
                positions[i*3] = (Math.random() - 0.5) * 10;
                positions[i*3+1] = Math.random() * 5;
                positions[i*3+2] = (Math.random() - 0.5) * 10;
            }
            particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const particleMaterial = new THREE.PointsMaterial({ size: 0.05, transparent: true, opacity: 0.5, color: 0xffffff });
            particles = new THREE.Points(particleGeometry, particleMaterial);
            scene.add(particles);
        }

        function loadVRM(url) {
            const loader = new GLTFLoader();
            const loadingOverlay = document.getElementById('loading-overlay');
            loadingOverlay.classList.remove('hidden');

            loader.register((parser) => new VRMLoaderPlugin(parser));
            loader.load(
                url,
                (gltf) => {
                    const vrm = gltf.userData.vrm;
                    if (currentVrm) {
                        scene.remove(currentVrm.scene);
                        VRMUtils.deepDispose(currentVrm.scene);
                    }
                    
                    vrm.scene.traverse((obj) => { obj.frustumCulled = false; });
                    vrm.scene.position.y = 0.1;
                    vrm.scene.rotation.y = Math.PI;
                    scene.add(vrm.scene);
                    currentVrm = vrm;
                    
                    loadingOverlay.classList.add('hidden');
                    console.log('角色更換完成');
                },
                undefined,
                (error) => {
                    console.error('更換角色失敗:', error);
                    loadingOverlay.classList.add('hidden');
                }
            );
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            if (currentVrm) {
                // 呼吸效果
                if (currentVrm.humanoid) {
                    const chest = currentVrm.humanoid.getNormalizedBoneNode('chest');
                    if (chest) chest.rotation.x = Math.sin(time * 1.5) * 0.01;
                }
                // 簡單嘴型同步
                if (isSpeaking && currentVrm.expressionManager) {
                    lipSyncTimer += delta * 15;
                    const mouthOpenness = (Math.sin(lipSyncTimer) + 1) / 2;
                    currentVrm.expressionManager.setValue('aa', mouthOpenness * 0.6);
                    currentVrm.expressionManager.setValue('happy', 0.5);
                } else if (currentVrm.expressionManager) {
                    currentVrm.expressionManager.setValue('aa', 0);
                }
                currentVrm.update(delta);
            }

            if (particles) particles.rotation.y += delta * 0.02;
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 語音與互動邏輯保持不變 ---
        // (略...)
        
        init();
    </script>
</body>
</html>
