<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 虛擬助教</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 防止手機滑動觸發手勢 */
        body { margin: 0; overflow: hidden; background-color: #1a202c; touch-action: none; }
        
        #canvas-container { 
            width: 100vw; 
            height: 100vh; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 0; 
            background-image: url('https://images.unsplash.com/photo-1554118811-1e0d58224f24?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }

        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        
        /* 隱藏滾動條 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 增強對話泡泡的可讀性動畫 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
                "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.2.0/lib/three-vrm.module.js"
            }
        }
    </script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer" class="flex flex-col justify-end p-4 relative">
        
        <!-- 對話區域優化：增強背景與陰影 -->
        <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 w-[calc(100%-2rem)] sm:w-full max-w-lg pointer-events-auto flex flex-col gap-3 bg-white/90 backdrop-blur-md p-5 rounded-3xl shadow-2xl border border-white/50 z-10 transition-all duration-300">
            
            <!-- AI 回覆內容：更深的字體顏色與行高 -->
            <div id="chat-bubble" class="hidden px-1 max-h-48 overflow-y-auto no-scrollbar animate-fade-in">
                <p id="chat-text" class="text-lg text-slate-800 font-semibold leading-relaxed tracking-wide drop-shadow-sm"></p>
            </div>

            <!-- 輸入控制區域 -->
            <div class="flex gap-2 w-full mt-1">
                <button id="mic-btn" class="bg-slate-100 hover:bg-white text-blue-600 px-3 py-3 rounded-2xl shadow-md border border-slate-200 transition-all shrink-0 flex items-center justify-center active:scale-90" title="語音輸入">
                    <svg id="mic-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                    </svg>
                </button>

                <input type="text" id="chat-input" placeholder="與晏韜對話..." class="flex-1 bg-slate-50/80 text-slate-900 placeholder-slate-400 px-4 py-3 rounded-2xl border border-slate-200 focus:outline-none focus:border-blue-400 focus:bg-white shadow-inner text-base transition-all font-medium" />
                
                <button id="send-btn" class="bg-blue-600 hover:bg-blue-700 active:scale-95 text-white px-6 py-3 rounded-2xl shadow-lg transition-all duration-150 font-bold text-base shrink-0">
                    發送
                </button>
            </div>
        </div>

        <!-- 狀態欄與隱藏操作說明 (保持隱藏，必要時可移除 hidden) -->
        <div class="flex justify-between items-end w-full">
            <div class="hidden bg-slate-900/80 backdrop-blur-md text-white p-4 rounded-xl shadow-xl border border-white/10 max-w-xs pointer-events-auto flex-col gap-2">
                <div class="flex items-center justify-between">
                    <h1 class="text-sm font-bold text-blue-400">系統狀態</h1>
                    <div id="status-light" class="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.8)]"></div>
                </div>
                <div id="loading-status" class="text-[10px] text-yellow-400 flex items-center">
                    <svg class="animate-spin h-3 w-3 mr-1" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    模型處理中
                </div>
                <div id="error-status" class="text-[10px] text-red-400 hidden"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

        // --- 全域變數 ---
        let scene, camera, renderer, controls;
        let currentVrm = undefined;
        let particles;
        const clock = new THREE.Clock();

        let knowledgeBaseText = "";
        let systemPromptText = "你是一個擁有 3D 虛擬身體的 AI 虛擬助教。你的名字叫做『晏韜』。回答要簡短生動、親切友善。";
        let openingPhrase = "您好！我是晏韜，文藻的 AI 虛擬助教，很高興為您服務。";

        let expressionTimer = 0;
        let expressionBlend = 1;
        let currentExpression = 'neutral';
        let targetExpression = 'neutral';
        const expressions = ['happy', 'angry', 'sad', 'relaxed', 'surprised', 'neutral'];

        let activeSpecialAction = null;
        let specialActionTimer = 0;

        let isSpeaking = false;
        let lipSyncTimer = 0;
        let conversationHistory = [];
        let autoRestartMic = false;

        // --- 載入設定 ---
        async function loadConfig() {
            try {
                const promptUrl = './prompt.txt';
                const kbUrl = './knowledgebase.txt';
                const [promptRes, kbRes] = await Promise.all([
                    fetch(promptUrl).catch(() => null),
                    fetch(kbUrl).catch(() => null)
                ]);
                if (kbRes && kbRes.ok) knowledgeBaseText = await kbRes.text();
                if (promptRes && promptRes.ok) {
                    const fullPromptText = await promptRes.text();
                    const parts = fullPromptText.split(/[=-]{3}\s*提示詞\s*[=-]{3}/);
                    if (parts.length > 1) {
                        openingPhrase = parts[0].replace(/[=-]{3}\s*開場詞\s*[=-]{3}/, '').trim();
                        systemPromptText = "你的名字是『晏韜』。" + parts[1].trim();
                    } else {
                        systemPromptText = fullPromptText.trim();
                    }
                }
            } catch (error) { console.warn("使用預設設定"); }
        }

        function triggerOpeningPhrase() {
            if (!openingPhrase) return;
            const chatBubble = document.getElementById('chat-bubble');
            const chatText = document.getElementById('chat-text');
            chatBubble.classList.remove('hidden');
            chatText.innerHTML = `${openingPhrase}`;
            speakAndLipSync(openingPhrase);
            conversationHistory.push({ role: "model", parts: [{ text: JSON.stringify({ reply: openingPhrase, expression: "happy" }) }] });
        }

        async function init() {
            const container = document.getElementById('canvas-container');
            await loadConfig();
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.45, -1.6); 

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(0, 1.3, 0); 
            controls.update();

            setupEnvironment();
            window.addEventListener('resize', onWindowResize);
            loadVRM('./jerry.vrm');
            animate();
        }

        function setupEnvironment() {
            const ambientLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.0);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
            directionalLight.position.set(2, 5, 3);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            // 加入些許粒子增加氛圍
            const particleCount = 100;
            const particleGeometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            for(let i = 0; i < particleCount; i++) {
                positions[i*3] = (Math.random() - 0.5) * 5;
                positions[i*3+1] = Math.random() * 3;
                positions[i*3+2] = (Math.random() - 0.5) * 5;
            }
            particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const particleMaterial = new THREE.PointsMaterial({ size: 0.02, color: 0xffffff, transparent: true, opacity: 0.5 });
            particles = new THREE.Points(particleGeometry, particleMaterial);
            scene.add(particles);
        }

        function loadVRM(url) {
            const loader = new GLTFLoader();
            loader.register((parser) => new VRMLoaderPlugin(parser));
            loader.load(url, (gltf) => {
                const vrm = gltf.userData.vrm;
                VRMUtils.removeUnnecessaryVertices(gltf.scene);
                vrm.scene.traverse((obj) => { if (obj.isMesh) obj.castShadow = true; });
                if (vrm.humanoid) {
                    const left = vrm.humanoid.getNormalizedBoneNode('leftUpperArm');
                    const right = vrm.humanoid.getNormalizedBoneNode('rightUpperArm');
                    if (left) left.rotation.z = -1.1; 
                    if (right) right.rotation.z = 1.1; 
                }
                vrm.scene.position.y = 0.1;
                vrm.scene.rotation.y = Math.PI;
                scene.add(vrm.scene);
                currentVrm = vrm;
                document.getElementById('loading-status')?.classList.add('hidden');
                triggerOpeningPhrase();
            }, undefined, (e) => {
                document.getElementById('error-status').classList.remove('hidden');
                document.getElementById('error-status').textContent = "模型載入失敗";
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();
            if (currentVrm) {
                if (currentVrm.humanoid) {
                    const chest = currentVrm.humanoid.getNormalizedBoneNode('chest');
                    if (chest) chest.rotation.x = Math.sin(time * 1.2) * 0.01;
                }
                if (currentVrm.expressionManager) {
                    expressionTimer += delta;
                    if (expressionTimer > 5.0) {
                        expressionTimer = 0;
                        currentExpression = targetExpression;
                        targetExpression = expressions[Math.floor(Math.random() * expressions.length)];
                        expressionBlend = 0;
                    }
                    if (expressionBlend < 1.0) expressionBlend += delta * 2.0;

                    expressions.forEach(exp => currentVrm.expressionManager.setValue(exp, 0));
                    
                    if (isSpeaking) {
                        currentVrm.expressionManager.setValue('happy', 0.8);
                        lipSyncTimer += delta * 15;
                        currentVrm.expressionManager.setValue('aa', (Math.sin(lipSyncTimer) + 1) * 0.4);
                    } else {
                        currentVrm.expressionManager.setValue(currentExpression, 1.0 - expressionBlend);
                        currentVrm.expressionManager.setValue(targetExpression, expressionBlend);
                    }
                }
                currentVrm.update(delta);
            }
            if (particles) particles.rotation.y += delta * 0.02;
            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 對話邏輯 ---
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const chatBubble = document.getElementById('chat-bubble');
        const chatText = document.getElementById('chat-text');

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;
            chatInput.value = '';
            chatBubble.classList.remove('hidden');
            chatText.innerHTML = `<span class="text-slate-500 text-sm italic">正在思考...</span>`;
            conversationHistory.push({ role: "user", parts: [{ text: text }] });
            
            const fullSystemInstruction = `${systemPromptText}\n【知識庫】\n${knowledgeBaseText}\n請以 JSON 格式回覆：{"reply": "...", "expression": "happy/neutral..."}`;

            try {
                const response = await fetch(`/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: conversationHistory,
                        systemInstruction: { parts: [{ text: fullSystemInstruction }] },
                        tools: [{ googleSearch: {} }]
                    })
                });
                const data = await response.json();
                const aiText = data.candidates[0].content.parts[0].text;
                let replyText = aiText;
                const jsonMatch = aiText.match(/\{[\s\S]*\}/);
                if (jsonMatch) {
                    const aiResponse = JSON.parse(jsonMatch[0]);
                    replyText = aiResponse.reply;
                    targetExpression = aiResponse.expression || 'neutral';
                    expressionBlend = 0;
                }
                chatText.innerHTML = replyText;
                speakAndLipSync(replyText);
                conversationHistory.push({ role: "model", parts: [{ text: jsonMatch ? jsonMatch[0] : aiText }] });
            } catch (error) {
                chatText.innerHTML = `<span class="text-red-500">連線出現問題。</span>`;
            }
        }

        function speakAndLipSync(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-TW';
            utterance.onstart = () => { isSpeaking = true; };
            utterance.onend = () => { isSpeaking = false; if (autoRestartMic && recognition) recognition.start(); };
            window.speechSynthesis.speak(utterance);
        }

        // --- 語音輸入 ---
        const micBtn = document.getElementById('mic-btn');
        let recognition = null;
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.lang = 'zh-TW';
            recognition.onstart = () => { 
                micBtn.classList.add('bg-red-100', 'text-red-600', 'animate-pulse');
                chatInput.placeholder = "聆聽中...";
            };
            recognition.onresult = (e) => { chatInput.value = e.results[0][0].transcript; };
            recognition.onend = () => {
                micBtn.classList.remove('bg-red-100', 'text-red-600', 'animate-pulse');
                chatInput.placeholder = "與晏韜對話...";
                if (chatInput.value) sendMessage();
            };
        }

        micBtn.addEventListener('click', () => { 
            window.speechSynthesis.cancel();
            isSpeaking = false;
            recognition?.start(); 
        });
        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });

        init();
    </script>
</body>
</html>
