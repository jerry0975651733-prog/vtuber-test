<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 虛擬助教</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 加入 touch-action: none 防止手機滑動時觸發下拉更新或返回手勢 */
        body { margin: 0; overflow: hidden; background-color: #1a202c; touch-action: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 0; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        
        /* 隱藏滾動條但保留滾動功能 (針對對話框內部) */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js",
                "three/examples/jsm/loaders/GLTFLoader": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js",
                "three/examples/jsm/loaders/RGBELoader": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/RGBELoader.js"
            }
        }
    </script>
</head>
<body class="bg-gray-900 text-white font-sans overflow-hidden">

    <!-- 3D 渲染區域 -->
    <div id="canvas-container"></div>

    <!-- UI 層 -->
    <div id="ui-layer" class="flex flex-col h-full">
        <!-- 頂部狀態欄 -->
        <div class="p-4 flex justify-between items-center pointer-events-auto">
            <div class="bg-black/40 backdrop-blur-md px-3 py-1 rounded-full text-sm border border-white/10 flex items-center gap-2">
                <div id="status-dot" class="w-2 h-2 rounded-full bg-green-500"></div>
                <span id="ai-status">AI 助手已就緒</span>
            </div>
            <div class="flex gap-2">
                 <button id="mic-btn" class="bg-white/10 hover:bg-white/20 backdrop-blur-md p-2 rounded-full border border-white/20 transition-all active:scale-95">
                    <svg id="mic-icon" class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                </button>
                <button id="settings-btn" class="bg-white/10 hover:bg-white/20 backdrop-blur-md p-2 rounded-full border border-white/20 transition-all">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </button>
            </div>
        </div>

        <!-- 中間空白區域 (供 3D 模型顯示) -->
        <div class="flex-grow"></div>

        <!-- 底部對話區域 -->
        <div class="p-4 md:p-6 w-full max-w-2xl mx-auto pointer-events-auto">
            <div class="bg-black/40 backdrop-blur-xl rounded-3xl p-4 border border-white/10 shadow-2xl">
                <!-- 訊息滾動區 -->
                <div id="chat-container" class="h-40 overflow-y-auto mb-4 space-y-3 no-scrollbar pr-1">
                    <div class="flex justify-start">
                        <div class="bg-blue-600/30 border border-blue-400/30 px-4 py-2 rounded-2xl rounded-bl-none max-w-[85%] text-sm">
                            你好！我是你的 AI 虛擬助手。你可以跟我聊聊或是問我問題。
                        </div>
                    </div>
                </div>

                <!-- 輸入框區域 -->
                <div class="flex gap-2 items-center bg-white/5 rounded-2xl p-1 border border-white/5">
                    <input id="chat-input" type="text" placeholder="輸入訊息..." class="bg-transparent flex-grow px-4 py-2 focus:outline-none text-white placeholder-white/30 text-sm">
                    <button id="send-btn" class="bg-blue-600 hover:bg-blue-500 p-2 rounded-xl transition-all shadow-lg active:scale-95">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 設定彈窗 -->
    <div id="settings-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 pointer-events-auto">
        <div class="bg-gray-800 border border-white/10 rounded-3xl p-6 w-full max-w-md shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold">設定</h3>
                <button id="close-settings" class="text-white/50 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="space-y-6">
                <div>
                    <label class="block text-sm text-white/50 mb-2">Google Gemini API Key</label>
                    <input id="api-key-input" type="password" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-2 focus:outline-none focus:border-blue-500 transition-colors" placeholder="在此輸入您的 API Key">
                    <p class="text-[10px] text-white/30 mt-2 italic">※ Key 將保存在瀏覽器本地快取，不會上傳至伺服器。</p>
                </div>

                <div>
                    <label class="block text-sm text-white/50 mb-2">模型知識庫 (Prompt)</label>
                    <textarea id="knowledge-base" class="w-full h-32 bg-black/40 border border-white/10 rounded-xl px-4 py-2 focus:outline-none focus:border-blue-500 text-sm transition-colors resize-none" placeholder="輸入你想讓 AI 知道的背景資訊..."></textarea>
                </div>

                <button id="save-settings" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold transition-all active:scale-[0.98]">儲存並套用</button>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader';
        import { RGBELoader } from 'three/examples/jsm/loaders/RGBELoader';

        let scene, camera, renderer, model, mixer, particles;
        let isSpeaking = false;
        let clock = new THREE.Clock();

        // 初始化場景
        function init() {
            scene = new THREE.Scene();
            
            // 背景改回暖色調，模擬咖啡廳燈光
            scene.background = new THREE.Color(0x2a1a15);
            scene.fog = new THREE.FogExp2(0x2a1a15, 0.05);

            const fov = 45;
            const aspect = window.innerWidth / window.innerHeight;
            camera = new THREE.PerspectiveCamera(fov, aspect, 0.1, 1000);
            camera.position.set(0, 1.4, 3.5);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // 咖啡廳暖色燈光
            const ambientLight = new THREE.AmbientLight(0xfff5e6, 0.6);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffffff, 1.0);
            mainLight.position.set(2, 5, 5);
            scene.add(mainLight);

            // 增加一個從側面來的暖橘光
            const warmLight = new THREE.PointLight(0xff9933, 1.5, 10);
            warmLight.position.set(-3, 2, 2);
            scene.add(warmLight);

            // 粉紅泡泡的點綴光源
            const pinkLight = new THREE.PointLight(0xffb6c1, 1.0, 5);
            pinkLight.position.set(1, 1, 2);
            scene.add(pinkLight);

            // 載入 HDR 環境（保持材質質感）
            new RGBELoader()
                .load('https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_08_1k.hdr', (texture) => {
                    texture.mapping = THREE.EquirectangularReflectionMapping;
                    scene.environment = texture;
                });

            // 初始化粉紅泡泡
            initPinkBubbles();

            // 載入模型
            const loader = new GLTFLoader();
            loader.load('https://models.readyplayer.me/6489370601977e2030006764.glb', (gltf) => {
                model = gltf.scene;
                scene.add(model);
                model.position.y = 0;
                animate();
            }, undefined, (error) => {
                console.error("模型載入失敗:", error);
                animate();
            });

            window.addEventListener('resize', onWindowResize);
        }

        function initPinkBubbles() {
            const geometry = new THREE.BufferGeometry();
            const count = 200; // 泡泡數量稍微減少，避免干擾主體
            const positions = new Float32Array(count * 3);
            const sizes = new Float32Array(count);
            const velocities = [];

            for (let i = 0; i < count; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 8;
                positions[i * 3 + 1] = Math.random() * 6 - 2;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 5;
                
                sizes[i] = Math.random() * 0.15 + 0.05;
                
                velocities.push({
                    y: Math.random() * 0.003 + 0.001,
                    x: (Math.random() - 0.5) * 0.0015,
                    phase: Math.random() * Math.PI * 2
                });
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            // 建立圓潤的泡泡貼圖
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 182, 193, 0.7)');
            gradient.addColorStop(0.5, 'rgba(255, 192, 203, 0.3)');
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            
            const texture = new THREE.CanvasTexture(canvas);

            const material = new THREE.PointsMaterial({
                color: 0xffb6c1,
                size: 0.12,
                map: texture,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                opacity: 0.5
            });

            particles = new THREE.Points(geometry, material);
            particles.userData.velocities = velocities;
            scene.add(particles);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            if (model) {
                model.position.y = Math.sin(time * 0.5) * 0.015;
                model.rotation.y = Math.sin(time * 0.2) * 0.03;
                
                if (isSpeaking) {
                    const mouthOpen = Math.abs(Math.sin(time * 15)) * 0.5;
                    setMorphTarget('viseme_aa', mouthOpen);
                } else {
                    setMorphTarget('viseme_aa', 0);
                }
                const blink = Math.sin(time * 4) > 0.98 ? 1 : 0;
                setMorphTarget('eyeBlinkLeft', blink);
                setMorphTarget('eyeBlinkRight', blink);
            }

            if (particles) {
                const positions = particles.geometry.attributes.position.array;
                const vels = particles.userData.velocities;
                for (let i = 0; i < vels.length; i++) {
                    positions[i * 3 + 1] += vels[i].y;
                    positions[i * 3] += Math.sin(time + vels[i].phase) * 0.001 + vels[i].x;
                    if (positions[i * 3 + 1] > 4) {
                        positions[i * 3 + 1] = -2;
                        positions[i * 3] = (Math.random() - 0.5) * 8;
                    }
                }
                particles.geometry.attributes.position.needsUpdate = true;
            }

            renderer.render(scene, camera);
        }

        function setMorphTarget(name, value) {
            if(!model) return;
            model.traverse(child => {
                if (child.isMesh && child.morphTargetDictionary && child.morphTargetDictionary[name] !== undefined) {
                    child.morphTargetInfluences[child.morphTargetDictionary[name]] = value;
                }
            });
        }

        init();

        // ------------------ UI 邏輯 ------------------
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const chatContainer = document.getElementById('chat-container');
        const aiStatus = document.getElementById('ai-status');
        const statusDot = document.getElementById('status-dot');
        const micBtn = document.getElementById('mic-btn');
        const micIcon = document.getElementById('mic-icon');
        const settingsBtn = document.getElementById('settings-btn');
        const settingsModal = document.getElementById('settings-modal');
        const closeSettings = document.getElementById('close-settings');
        const saveSettings = document.getElementById('save-settings');
        const apiKeyInput = document.getElementById('api-key-input');
        const knowledgeBaseInput = document.getElementById('knowledge-base');

        let chatHistory = [];
        let isRecording = false;
        let recognition = null;
        let autoRestartMic = false;

        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            const savedKB = localStorage.getItem('gemini_knowledge_base');
            if (savedKey) apiKeyInput.value = savedKey;
            if (savedKB) knowledgeBaseInput.value = savedKB;
        });

        settingsBtn.addEventListener('click', () => settingsModal.classList.remove('hidden'));
        closeSettings.addEventListener('click', () => settingsModal.classList.add('hidden'));
        saveSettings.addEventListener('click', () => {
            localStorage.setItem('gemini_api_key', apiKeyInput.value);
            localStorage.setItem('gemini_knowledge_base', knowledgeBaseInput.value);
            settingsModal.classList.add('hidden');
        });

        async function sendMessage() {
            const text = chatInput.value.trim();
            const apiKey = apiKeyInput.value;
            if (!text) return;
            if (!apiKey) {
                appendMessage('system', '請先點擊右上角設定 API Key。');
                settingsModal.classList.remove('hidden');
                return;
            }

            appendMessage('user', text);
            chatInput.value = '';
            setAIStatus('thinking');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        history: chatHistory,
                        apiKey: apiKey,
                        knowledgeBase: knowledgeBaseInput.value
                    })
                });
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                const reply = data.reply;
                appendMessage('ai', reply);
                chatHistory.push({ role: 'user', content: text }, { role: 'model', content: reply });
                if (chatHistory.length > 10) chatHistory = chatHistory.slice(-10);
                setAIStatus('speaking');
                speak(reply);
            } catch (err) {
                appendMessage('system', '發生錯誤: ' + err.message);
                setAIStatus('idle');
            }
        }

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            div.innerHTML = `<div class="${role === 'user' ? 'bg-blue-600' : 'bg-blue-600/30 border border-blue-400/30'} px-4 py-2 rounded-2xl max-w-[85%] text-sm shadow-md">${text}</div>`;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function setAIStatus(status) {
            if (status === 'thinking') {
                aiStatus.innerText = 'AI 正在思考...';
                statusDot.className = 'w-2 h-2 rounded-full bg-yellow-500 animate-pulse';
            } else if (status === 'speaking') {
                aiStatus.innerText = 'AI 正在說話...';
                statusDot.className = 'w-2 h-2 rounded-full bg-blue-500 animate-bounce';
            } else {
                aiStatus.innerText = 'AI 助手已就緒';
                statusDot.className = 'w-2 h-2 rounded-full bg-green-500';
            }
        }

        function speak(text) {
            if (!window.speechSynthesis) return;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-TW';
            utterance.onstart = () => { isSpeaking = true; };
            utterance.onend = () => { 
                isSpeaking = false; 
                setAIStatus('idle');
                if (autoRestartMic) startListening();
            };
            window.speechSynthesis.speak(utterance);
        }

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'zh-TW';
            recognition.onstart = () => {
                isRecording = true;
                micBtn.classList.add('bg-red-500/50');
                aiStatus.innerText = '正在聽你說話...';
            };
            recognition.onend = () => {
                isRecording = false;
                micBtn.classList.remove('bg-red-500/50');
            };
            recognition.onresult = (event) => {
                chatInput.value = event.results[0][0].transcript;
                sendMessage();
            };
        }

        function startListening() {
            if (recognition && !isRecording) recognition.start();
        }

        micBtn.addEventListener('click', () => {
            if (isRecording) {
                recognition.stop();
                autoRestartMic = false;
            } else {
                autoRestartMic = true;
                window.speechSynthesis.cancel();
                isSpeaking = false;
                startListening();
            }
        });

        sendBtn.addEventListener('click', () => sendMessage());
        chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
